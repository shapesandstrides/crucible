[project]
name = "sns-kernels"
version = "0.0.1"
description = "Honest correctness and timing for Triton kernels"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "nvidia-ml-py>=12.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA device"]
