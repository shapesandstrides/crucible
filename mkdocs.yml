site_name: crucible
site_description: Honest correctness and timing for Triton kernels
site_url: https://shapesandstrides.github.io/crucible/
repo_url: https://github.com/shapesandstrides/crucible
repo_name: shapesandstrides/crucible
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Testing a kernel: guide/testing.md
      - Measuring: guide/measuring.md
      - Comparing: guide/comparing.md
      - Measurement tiers: guide/tiers.md
      - Choosing a host: guide/hosts.md
      - What this cannot catch: guide/limits.md
  - API reference: reference.md
  - Why this exists: why.md

# The private design docs live under docs/superpowers/ and are gitignored.
# Exclude them from the build too, or a local `mkdocs build` would render
# them into site/ and a `gh-deploy` would publish them.
exclude_docs: |
  superpowers/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shapesandstrides/crucible
