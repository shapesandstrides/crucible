name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU-only runner: torch's CPU wheel is enough, since the GPU-marked
      # tests skip themselves when no CUDA device is present. The pure logic
      # — statistics, tier assignment, environment parsing — is the majority
      # of the suite and is fully covered here.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q
